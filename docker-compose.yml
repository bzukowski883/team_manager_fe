name: tm_fe

services:
  react:
    build:
      context: ./
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/usr/src/app
      - node_modules_tm_react:/usr/src/app/node_modules
    networks:
      - team_manager_net

networks:
  team_manager_net:
    external: true

volumes:
  node_modules_tm_react: